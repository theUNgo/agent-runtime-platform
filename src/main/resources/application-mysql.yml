spring:
  datasource:
    url: jdbc:mysql://${AGENT_DB_HOST:}:${AGENT_DB_PORT:3306}/${AGENT_DB_NAME:}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${AGENT_DB_USERNAME:}
    password: ${AGENT_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

agent:
  auth:
    bootstrap-username: ${AGENT_BOOTSTRAP_USERNAME:admin}
    bootstrap-password: ${AGENT_BOOTSTRAP_PASSWORD:}
    bootstrap-display-name: ${AGENT_BOOTSTRAP_DISPLAY_NAME:Platform Admin}
